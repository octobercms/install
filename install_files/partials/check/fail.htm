<div class="callout callout-danger">
    <h4 data-lang>webinstaller.system_check_failed</h4>
    <p>
        {{#reason}}{{reason}}{{/reason}}
        {{^reason}}<span data-lang>webinstaller.system_check_failed_comment</span>{{/reason}}
        <a href="https://docs.octobercms.com" target="_blank" data-lang>webinstaller.see_documentation</a>
    </p>
    <p><a href="javascript:Installer.Events.retry()" class="btn btn-default btn-sm" data-lang>webinstaller.system_check_retry</a></p>
    <small><span data-lang>webinstaller.reason_code</span> {{code}}</small>
</div>
