<div class="callout callout-danger">
    {{#reason}}
        <h4>{{{reason}}}</h4>
    {{/reason}}
    {{^reason}}
        <h4 data-lang>installer.install_failed_label</h4>
    {{/reason}}
    <p>
        <span data-lang>webinstaller.progress_failed_comment</span>
        <code>install_files/install.log</code>
    </p>
    <p>
        <a href="https://docs.octobercms.com/3.x/setup/installation.html#troubleshooting-installation" target="_blank" data-lang>webinstaller.see_documentation</a>
    </p>
    <p><a href="javascript:Installer.Events.retry()" class="btn btn-default btn-sm" data-lang>webinstaller.try_again</a></p>
</div>
